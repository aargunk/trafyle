# Trafyle kurulum dosyalarını GitHub'ın Mac ve Windows makinelerinde üretir.
#
# Yeni sürüm yayınlamak:  app.py içindeki APP_VERSION'ı artırın (ör. 3.4.1), değişikliği gönderin, sonra
#   - ya etiket gönderin:  git tag v3.4.1 && git push origin v3.4.1   (sürüm sayfası kendiliğinden oluşturulur;
#     notlar .github/release-notes.md dosyasından alınır)
#   - ya da GitHub'da Releases › "Draft a new release" › yeni etiket "v3.4.1" › Publish.
# Birkaç dakika sonra Trafyle-Kurulum.exe ve Trafyle-mac.zip sürüm sayfasına eklenir.
#
# Denemek için: Actions › "Trafyle sürümü" › Run workflow (dosyalar yalnızca Artifacts'e konur).
name: Trafyle sürümü
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

env:
  TRAFYLE_RELEASE_BUILD: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sürüm numarası etiketle uyuşuyor mu?
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $t = "${{ github.event.release.tag_name || github.ref_name }}".TrimStart('v','V')
          if ($v -ne $t) { Write-Error "app.py APP_VERSION ($v) ile etiket ($t) farklı. Önce APP_VERSION'ı güncelleyin."; exit 1 }
      - name: Kütüphaneler
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Paketle
        shell: cmd
        run: echo.| windows\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Trafyle-Windows
          path: dist/Trafyle-Kurulum.exe

  macos:
    runs-on: macos-14   # Apple Silicon (M1 ve sonrası)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kütüphaneler
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller
      - name: Paketle
        run: |
          chmod +x build.sh
          export TRAFYLE_BUILD_DIR="$PWD/build-out"
          SKIP_INSTALL=1 PY=.venv/bin/python ./build.sh
          mkdir -p dist
          ditto -c -k --keepParent build-out/dist/Trafyle.app dist/Trafyle-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Trafyle-macOS
          path: dist/Trafyle-mac.zip

  yayinla:
    if: github.event_name != 'workflow_dispatch'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dosyalar
          merge-multiple: true
      - name: Sürümü oluştur ve dosyaları ekle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --title "Trafyle ${TAG#v}" \
              --notes-file .github/release-notes.md --verify-tag
          fi
          gh release upload "$TAG" dosyalar/* --clobber --repo "${{ github.repository }}"
